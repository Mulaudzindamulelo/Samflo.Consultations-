<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1f3a" />
    <meta name="description" content="Samflo Consultations - Professional Bookkeeping System" />
    <title>Samflo Consultations - Bookkeeping System</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
        color: #e2e8f0;
        overflow-x: hidden;
      }
      #root {
        display: flex;
        flex-direction: column;
      }
      /* Loading Spinner */
      .loading-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      }
      .spinner {
        border: 4px solid rgba(167, 139, 250, 0.2);
        border-top: 4px solid #a78bfa;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      /* Fallback text */
      .loading-text {
        color: #a78bfa;
        margin-top: 20px;
        font-size: 16px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="
        background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
        color: #e2e8f0;
        padding: 40px;
        text-align: center;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      ">
        <h1 style="margin-bottom: 20px; color: #a78bfa;">Samflo Consultations</h1>
        <p>You need to enable JavaScript to run this application.</p>
        <p style="margin-top: 20px; font-size: 14px; color: #94a3b8;">
          Please enable JavaScript in your browser settings and refresh the page.
        </p>
      </div>
    </noscript>
    
    <!-- React App Root -->
    <div id="root">
      <!-- Loading spinner while app loads -->
      <div class="loading-container">
        <div>
          <div class="spinner"></div>
          <div class="loading-text">Loading Samflo Consultations...</div>
        </div>
      </div>
    </div>

    <!-- React Scripts -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  </body>
</html>
